name: webtest-atlas
services:
  demo:
    image: ${WEBTEST_ATLAS_DEMO_IMAGE:-python:3.13-alpine}
    entrypoint: ["python", "-B", "/srv/atlas/demo_server.py"]
    ports:
      - "127.0.0.1:${WEBTEST_ATLAS_DEMO_PORT:-18765}:8080"
    environment:
      WEBTEST_ATLAS_DEMO_MODE: ${WEBTEST_ATLAS_DEMO_MODE:-normal}
      WEBTEST_ATLAS_DEMO_SESSION_SECONDS: ${WEBTEST_ATLAS_DEMO_SESSION_SECONDS:-3600}
      WEBTEST_ATLAS_DEMO_ACCOUNT: ${WEBTEST_ATLAS_DEMO_ACCOUNT:-atlas-demo}
      WEBTEST_ATLAS_DEMO_PASSWORD: ${WEBTEST_ATLAS_DEMO_PASSWORD:-atlas-demo-only}
    volumes:
      - ./examples:/srv/atlas:ro
