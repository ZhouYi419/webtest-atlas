name: webtest-atlas
services:
  demo:
    image: ${WEBTEST_ATLAS_DEMO_IMAGE:-nginx:stable-alpine}
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${WEBTEST_ATLAS_DEMO_PORT:-18765}:8080"
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/demo:/srv/atlas:ro
